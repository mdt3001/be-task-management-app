          type: array
          items: { $ref: '#/components/schemas/Permission' }
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Workspace:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        description:
          oneOf:
            - type: string
            - type: 'null'
        owner: { $ref: '#/components/schemas/ObjectId' }
        inviteCode: { type: string }
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Member:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        userId: { $ref: '#/components/schemas/ObjectId' }
        workspaceId: { $ref: '#/components/schemas/ObjectId' }
        role:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/Role'
        status: { $ref: '#/components/schemas/MemberStatus' }
        joinedAt: { $ref: '#/components/schemas/ISODate' }
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Project:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
