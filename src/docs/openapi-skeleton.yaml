openapi: 3.0.3
info:
  title: Task Management API
  version: 1.0.0
  description: OpenAPI skeleton generated from current models and enums.

servers:
  - url: /api/v1
    description: Default API prefix

tags:
  - name: Auth
  - name: User
  - name: Account
  - name: Workspace
  - name: Member
  - name: Role
  - name: Project
  - name: Task
  - name: Comment
  - name: Attachment
  - name: Label
