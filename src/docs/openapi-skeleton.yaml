components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    MemberId:
      in: path
      name: memberId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    ProjectId:
      in: path
      name: projectId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    TaskId:
      in: path
      name: taskId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    CommentId:
      in: path
      name: commentId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    AttachmentId:
      in: path
      name: attachmentId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    LabelId:
      in: path
      name: labelId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    NotificationId:
      in: path
      name: notificationId
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 65f151bc1e2bdbaf0d7fbc12
    ISODate:
      type: string
      format: date-time
    Provider:
      type: string
      enum: [google, github, facebook, email]
    RoleName:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
    Permission:
      type: string
      enum:
        - CREATE_WORKSPACE
        - DELETE_WORKSPACE
        - EDIT_WORKSPACE
        - MANAGE_WORKSPACE_SETTINGS
        - ADD_MEMBER
        - REMOVE_MEMBER
        - CHANGE_MEMBER_ROLE
        - CREATE_PROJECT
        - EDIT_PROJECT
        - DELETE_PROJECT
        - CREATE_TASK
        - EDIT_TASK
        - DELETE_TASK
        - VIEW_ONLY
    MemberStatus:
      type: string
      enum: [INVITED, ACTIVE, SUSPENDED, LEFT]
    ProjectStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    TaskStatus:
      type: string
      enum: [BACKLOG, TODO, IN_PROGRESS, DONE]
    TaskPriority:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
    NotificationType:
      type: string
      enum: [TASK_ASSIGNED, TASK_DUE, COMMENT_MENTION, WORKSPACE_INVITE]
    TaskActivityAction:
      type: string
      enum: [CREATED, UPDATED, STATUS_CHANGED, ASSIGNED, COMMENTED, DELETED]

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
      required: [page, limit, total, totalPages]

    SuccessResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
      required: [accessToken, refreshToken]

    Account:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        provider: { $ref: '#/components/schemas/Provider' }
        providerId: { type: string }
        userId: { $ref: '#/components/schemas/ObjectId' }
        tokenExpiry:
          oneOf:
            - $ref: '#/components/schemas/ISODate'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    User:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        email: { type: string, format: email }
        avatar:
          oneOf:
            - type: string
            - type: 'null'
        isActive: { type: boolean }
        lastLogin:
          oneOf:
            - $ref: '#/components/schemas/ISODate'
            - type: 'null'
        currentWorkspace:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Role:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { $ref: '#/components/schemas/RoleName' }
