openapi: 3.0.3
info:
  title: Task Management API Skeleton
  version: 0.1.0
  description: |
    OpenAPI skeleton for team implementation.
    Prioritized by phases: P0 (critical), P1 (high), P2 (medium).

servers:
  - url: /api/v1
    description: Default API prefix

tags:
  - name: Auth
  - name: Workspace
  - name: Member
  - name: Project
  - name: Task
  - name: Subtask
  - name: Invitation
  - name: Comment
  - name: Activity
  - name: Notification
  - name: Label
  - name: Attachment
  - name: Internal

security:
  - bearerAuth: []

paths:
  # ========================
  # P0 - Foundation / Auth
  # ========================
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/context:
    get:
      tags: [Workspace]
      summary: Get workspace context for current user
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Context loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceContextResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  # ========================
  # P0 - Member / RBAC
  # ========================
  /workspaces/{workspaceId}/members:
    get:
      tags: [Member]
      summary: List members
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberListResponse'

  /workspaces/{workspaceId}/members/{memberId}:
    get:
      tags: [Member]
      summary: Get member by id
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Member detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /workspaces/{workspaceId}/members/{memberId}/role:
    patch:
      tags: [Member]
      summary: Update member role
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /workspaces/{workspaceId}/members/{memberId}/status:
    patch:
      tags: [Member]
      summary: Update member status
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberStatusRequest'
      responses:
        '200':
          description: Member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'

  # ========================
  # P0 - Project
  # ========================
  /workspaces/{workspaceId}/projects:
    post:
      tags: [Project]
      summary: Create project
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    get:
      tags: [Project]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'

  /workspaces/{workspaceId}/projects/check-key:
    get:
      tags: [Project]
      summary: Check project key availability
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Key check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectKeyCheckResponse'

  /workspaces/{workspaceId}/projects/{projectId}:
    get:
      tags: [Project]
      summary: Get project by id
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    patch:
      tags: [Project]
      summary: Update project
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    delete:
      tags: [Project]
      summary: Delete project
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/projects/{projectId}/archive:
    patch:
      tags: [Project]
      summary: Archive or unarchive project
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                archived:
                  type: boolean
              required: [archived]
      responses:
        '200':
          description: Archive status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ========================
  # P0 - Task core + Subtask
  # ========================
  /workspaces/{workspaceId}/projects/{projectId}/tasks:
    post:
      tags: [Task]
      summary: Create task in project
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
    get:
      tags: [Task]
      summary: List project tasks
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'

  /workspaces/{workspaceId}/tasks/{taskId}:
    get:
      tags: [Task]
      summary: Get task by id
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
    patch:
      tags: [Task]
      summary: Update task
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
    delete:
      tags: [Task]
      summary: Delete task
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/status:
    patch:
      tags: [Task]
      summary: Update task status
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
              required: [status]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/assignees:
    patch:
      tags: [Task]
      summary: Update assignees
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeIds:
                  type: array
                  items:
                    type: string
              required: [assigneeIds]
      responses:
        '200':
          description: Assignees updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/due-date:
    patch:
      tags: [Task]
      summary: Update due date
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dueDate:
                  type: string
                  format: date-time
                  nullable: true
              required: [dueDate]
      responses:
        '200':
          description: Due date updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/watchers:
    post:
      tags: [Task]
      summary: Add watcher
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memberId:
                  type: string
              required: [memberId]
      responses:
        '200':
          description: Watcher added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/watchers/{memberId}:
    delete:
      tags: [Task]
      summary: Remove watcher
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Watcher removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/labels:
    post:
      tags: [Task]
      summary: Attach label to task
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                labelId:
                  type: string
              required: [labelId]
      responses:
        '200':
          description: Label attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/labels/{labelId}:
    delete:
      tags: [Task]
      summary: Detach label from task
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/LabelId'
      responses:
        '200':
          description: Label detached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/tasks/{parentTaskId}/subtasks:
    post:
      tags: [Subtask]
      summary: Create subtask
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: parentTaskId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Subtask created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/subtasks:
    get:
      tags: [Subtask]
      summary: List subtasks
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Subtask list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/tree:
    get:
      tags: [Subtask]
      summary: Get task tree
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTreeResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/breadcrumb:
    get:
      tags: [Subtask]
      summary: Get task breadcrumb
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Breadcrumb path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskBreadcrumbResponse'

  /workspaces/{workspaceId}/tasks/{taskId}/parent:
    patch:
      tags: [Subtask]
      summary: Change parent task (must prevent circular reference)
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parentTaskId:
                  type: string
                  nullable: true
              required: [parentTaskId]
      responses:
        '200':
          description: Parent updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ========================
  # P1 - Invitation
  # ========================
  /workspaces/{workspaceId}/invitations:
    post:
      tags: [Invitation]
      summary: Create invitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
    get:
      tags: [Invitation]
      summary: List invitations
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Invitation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationListResponse'

  /invitations/{token}/accept:
    post:
      tags: [Invitation]
      summary: Accept invitation
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAcceptResponse'

  /workspaces/{workspaceId}/invitations/{invitationId}/revoke:
    post:
      tags: [Invitation]
      summary: Revoke invitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    post:
      tags: [Invitation]
      summary: Resend invitation
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'

  /workspaces/{workspaceId}/invitations/expire-stale:
    post:
      tags: [Invitation]
      summary: Expire stale invitations
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Expiration summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      expiredCount:
                        type: integer

  # ========================
  # P1 - Comment
  # ========================
  /workspaces/{workspaceId}/tasks/{taskId}/comments:
    post:
      tags: [Comment]
      summary: Create comment/reply
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
    get:
      tags: [Comment]
      summary: List comments by task
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Comment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentListResponse'

  /workspaces/{workspaceId}/comments/{commentId}:
    get:
      tags: [Comment]
      summary: Get comment by id
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: Comment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
    patch:
      tags: [Comment]
      summary: Edit comment
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required: [content]
      responses:
        '200':
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
    delete:
      tags: [Comment]
      summary: Soft delete comment
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/CommentId'
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ========================
  # P1 - Activity
  # ========================
  /workspaces/{workspaceId}/tasks/{taskId}/activities:
    get:
      tags: [Activity]
      summary: List task activities
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'

  /workspaces/{workspaceId}/activities:
    get:
      tags: [Activity]
      summary: List workspace activities
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Activity list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityListResponse'

  /internal/activities/rebuild:
    post:
      tags: [Internal]
      summary: Rebuild activity logs (internal)
      responses:
        '200':
          description: Rebuild summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ========================
  # P1 - Notification
  # ========================
  /workspaces/{workspaceId}/notifications:
    get:
      tags: [Notification]
      summary: List notifications
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /workspaces/{workspaceId}/notifications/unread-count:
    get:
      tags: [Notification]
      summary: Get unread notification count
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      unreadCount:
                        type: integer

  /workspaces/{workspaceId}/notifications/{notificationId}/read:
    patch:
      tags: [Notification]
      summary: Mark one notification as read
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notification updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /workspaces/{workspaceId}/notifications/read-all:
    patch:
      tags: [Notification]
      summary: Mark all notifications as read
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Notifications updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /internal/notifications/dispatch:
    post:
      tags: [Internal]
      summary: Dispatch notifications by event (internal)
      responses:
        '200':
          description: Dispatch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ========================
  # P2 - Label
  # ========================
  /workspaces/{workspaceId}/labels:
    post:
      tags: [Label]
      summary: Create label
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabelRequest'
      responses:
        '201':
          description: Label created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelResponse'
    get:
      tags: [Label]
      summary: List labels
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Label list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelListResponse'

  /workspaces/{workspaceId}/labels/{labelId}:
    patch:
      tags: [Label]
      summary: Update label
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LabelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLabelRequest'
      responses:
        '200':
          description: Label updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelResponse'
    delete:
      tags: [Label]
      summary: Delete label
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/LabelId'
      responses:
        '200':
          description: Label deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # ========================
  # P2 - Attachment metadata
  # ========================
  /workspaces/{workspaceId}/tasks/{taskId}/attachments:
    post:
      tags: [Attachment]
      summary: Create attachment metadata
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachmentRequest'
      responses:
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
    get:
      tags: [Attachment]
      summary: List task attachments
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Attachment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentListResponse'

  /workspaces/{workspaceId}/attachments/{attachmentId}:
    get:
      tags: [Attachment]
      summary: Get attachment by id
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Attachment detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponse'
    delete:
      tags: [Attachment]
      summary: Delete attachment metadata
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
    LabelId:
      name: labelId
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Generic wrappers
    SuccessResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            success:
              type: boolean
              example: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true

    Meta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    # Auth
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    AuthTokensResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            user:
              $ref: '#/components/schemas/User'

    TokenRefreshResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string

    WorkspaceContextResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            workspace:
              $ref: '#/components/schemas/Workspace'
            member:
              $ref: '#/components/schemas/Member'
            permissions:
              type: array
              items:
                type: string

    # Member
    UpdateMemberRoleRequest:
      type: object
      properties:
        role:
          type: string
      required: [role]

    UpdateMemberStatusRequest:
      type: object
      properties:
        status:
          type: string
      required: [status]

    MemberResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Member'

    MemberListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        meta:
          $ref: '#/components/schemas/Meta'

    # Project
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        description:
          type: string
      required: [name, key]

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        archived:
          type: boolean

    ProjectResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Project'

    ProjectListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        meta:
          $ref: '#/components/schemas/Meta'

    ProjectKeyCheckResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            available:
              type: boolean

    # Task / Subtask
    CreateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        dueDate:
          type: string
          format: date-time
          nullable: true
        assigneeIds:
          type: array
          items:
            type: string
        watcherIds:
          type: array
          items:
            type: string
        labelIds:
          type: array
          items:
            type: string
      required: [title]

    UpdateTaskRequest:
      allOf:
        - $ref: '#/components/schemas/CreateTaskRequest'

    TaskResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Task'

    TaskListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        meta:
          $ref: '#/components/schemas/Meta'

    TaskTreeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            root:
              $ref: '#/components/schemas/Task'
            children:
              type: array
              items:
                $ref: '#/components/schemas/Task'

    TaskBreadcrumbResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            path:
              type: array
              items:
                $ref: '#/components/schemas/Task'

    # Invitation
    CreateInvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
        expiresAt:
          type: string
          format: date-time
      required: [email, role]

    InvitationResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Invitation'

    InvitationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
        meta:
          $ref: '#/components/schemas/Meta'

    InvitationAcceptResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            workspace:
              $ref: '#/components/schemas/Workspace'
            member:
              $ref: '#/components/schemas/Member'

    # Comment
    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
        parentCommentId:
          type: string
          nullable: true
      required: [content]

    CommentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Comment'

    CommentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        meta:
          $ref: '#/components/schemas/Meta'

    # Activity
    ActivityListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskActivity'
        meta:
          $ref: '#/components/schemas/Meta'

    # Notification
    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/Meta'

    # Label
    CreateLabelRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
      required: [name, color]

    UpdateLabelRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string

    LabelResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Label'

    LabelListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Label'

    # Attachment
    CreateAttachmentRequest:
      type: object
      properties:
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        storageKey:
          type: string
      required: [fileName, mimeType, size, storageKey]

    AttachmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Attachment'

    AttachmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    # Domain entities (minimal skeleton)
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string

    Workspace:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    Member:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        workspaceId:
          type: string
        role:
          type: string
        status:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        key:
          type: string
        description:
          type: string
        archived:
          type: boolean

    Task:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        projectId:
          type: string
        parentTaskId:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: string
        dueDate:
          type: string
          format: date-time
          nullable: true
        subtaskCount:
          type: integer

    Invitation:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string
        token:
          type: string
        expiresAt:
          type: string
          format: date-time

    Comment:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        taskId:
          type: string
        parentCommentId:
          type: string
          nullable: true
        content:
          type: string
        isDeleted:
          type: boolean

    TaskActivity:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        taskId:
          type: string
        type:
          type: string
        actorId:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        memberId:
          type: string
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        readAt:
          type: string
          format: date-time
          nullable: true

    Label:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        name:
          type: string
        color:
          type: string

    Attachment:
      type: object
      properties:
        id:
          type: string
        workspaceId:
          type: string
        taskId:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        storageKey:
          type: string
