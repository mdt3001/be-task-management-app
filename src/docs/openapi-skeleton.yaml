        content: { type: string }
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        isRead: { type: boolean }
        readAt:
          oneOf:
            - $ref: '#/components/schemas/ISODate'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

