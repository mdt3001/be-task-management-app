        title: { type: string }
        description: { type: string }
        project: { $ref: '#/components/schemas/ObjectId' }
        workspace: { $ref: '#/components/schemas/ObjectId' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        assignedTo:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        createdBy: { $ref: '#/components/schemas/ObjectId' }
        dueDate:
          oneOf:
            - $ref: '#/components/schemas/ISODate'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Comment:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        taskId: { $ref: '#/components/schemas/ObjectId' }
        workspaceId: { $ref: '#/components/schemas/ObjectId' }
        authorId: { $ref: '#/components/schemas/ObjectId' }
        content: { type: string }
        parentCommentId:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        editedAt:
          oneOf:
            - $ref: '#/components/schemas/ISODate'
            - type: 'null'
        deletedAt:
          oneOf:
            - $ref: '#/components/schemas/ISODate'
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Attachment:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        taskId: { $ref: '#/components/schemas/ObjectId' }
        workspaceId: { $ref: '#/components/schemas/ObjectId' }
        uploaderId: { $ref: '#/components/schemas/ObjectId' }
        fileName: { type: string }
        mimeType: { type: string }
        size: { type: integer, minimum: 0 }
        storageKey: { type: string }
        url: { type: string, format: uri }
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Label:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        workspaceId: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        color: { type: string, example: '#6366F1' }
        description: { type: string }
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    Invitation:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        workspaceId: { $ref: '#/components/schemas/ObjectId' }
