          type: array
          items: { $ref: '#/components/schemas/TaskActivityChange' }
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        createdAt: { $ref: '#/components/schemas/ISODate' }
        updatedAt: { $ref: '#/components/schemas/ISODate' }

    RegisterRequest:
