services:
  - type: web
    name: task-management-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node /opt/render/project/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://fe-task-management-app-pt9b.vercel.app
      - key: FRONTEND_GOOGLE_CALLBACK_URL
        value: https://fe-task-management-app-pt9b.vercel.app/auth/google/callback
